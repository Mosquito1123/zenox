<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #8ecae6;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .cloud-a { animation: drift 36s linear infinite; }
  .cloud-b { animation: drift 48s linear infinite; }
  .cloud-c { animation: drift 28s linear infinite; }
  .lane { animation: lane 0.28s linear infinite; }
  .chain { animation: lane 0.18s linear infinite; }
  .shadow {
    transform-box: view-box;
    transform-origin: 455px 514px;
    animation: squash 0.5s ease-in-out infinite;
  }
  .nod { animation: nod 1s ease-in-out infinite; }
  .pouch {
    transform-box: fill-box;
    transform-origin: center;
    animation: pouch 1s ease-in-out infinite;
  }
  .wing {
    transform-box: view-box;
    transform-origin: 430px 320px;
    animation: wing 1s ease-in-out infinite;
  }
  .tail {
    transform-box: view-box;
    transform-origin: 280px 330px;
    animation: tail 0.5s ease-in-out infinite;
  }
  .lid {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.2s infinite;
  }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-1200px); }
  }
  @keyframes lane {
    to { stroke-dashoffset: 84; }
  }
  @keyframes squash {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(0.95); }
  }
  @keyframes nod {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }
  @keyframes pouch {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.02, 1.08); }
  }
  @keyframes wing {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-1.6deg); }
  }
  @keyframes tail {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes blink {
    0%, 46%, 54%, 100% { transform: scaleY(0); }
    50% { transform: scaleY(1); }
  }
</style>
</head>
